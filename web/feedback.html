<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComboFox Feedback</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #141a2a;
      --text: #e8edf8;
      --muted: #aeb9cf;
      --accent: #1ec8a5;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1a2340 0%, var(--bg) 55%);
      color: var(--text);
    }
    main {
      max-width: 760px;
      margin: 24px auto;
      padding: 24px;
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid #222c44;
      border-radius: 14px;
    }
    p { line-height: 1.6; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>ComboFox Feedback</h1>
    <p>We would love your feedback. You can send comments, bug reports, and feature requests by email.</p>
    <p><a href="mailto:support@combofox.net?subject=ComboFox%20feedback">Email support@combofox.net</a></p>
    <p>You can also open the ComboFox app and submit feedback from the in-app Feedback screen.</p>
  </main>
</body>
</html>
